name: FOR THE CULTURE Editorial Radar

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: for-the-culture-editorial
  cancel-in-progress: true

jobs:
  scan-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: false
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run FOR THE CULTURE editorial radar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EDITORIAL_MODEL: gemini-3.7-flash
          EDITORIAL_MAX_STORIES_PER_SCAN: 3
          EDITORIAL_MAX_AGE_HOURS: 96
          EDITORIAL_SOURCE_ITEMS: 18
        run: node scripts/editorial-radar.mjs

      - name: Check editorial run status
        if: always()
        run: |
          if [ -f editorial-run-status.json ]; then cat editorial-run-status.json; fi

      - name: Commit new editorial feed when stories changed
        id: feed_commit
        run: |
          git config user.name "FOR THE CULTURE Editorial Radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/editorial-feed.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new published editorial feed content."
          else
            git commit -m "chore: update FOR THE CULTURE editorial feed"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build website
        run: pnpm run build

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
