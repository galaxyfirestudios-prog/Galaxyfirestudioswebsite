name: FOR THE CULTURE Editorial Radar

on:
  # Run immediately when the site changes, while ignoring the generated feed
  # commit itself so the editorial workflow cannot trigger itself in a loop.
  push:
    branches:
      - main
    paths-ignore:
      - public/editorial-feed.json
      - editorial-run-status.json
  # The newsroom also scans every six hours and can be started manually.
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Share the Pages deployment lane with the normal site deploy so two
  # workflows can never try to create the same GitHub Pages deployment
  # at the same time.
  group: pages
  cancel-in-progress: false

jobs:
  scan-build-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: false
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run FOR THE CULTURE editorial radar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EDITORIAL_MODEL: gemini-3.5-flash-lite
          EDITORIAL_GENERATION_MODE: single-batch
          EDITORIAL_MAX_STORIES_PER_SCAN: 4
          EDITORIAL_GEMINI_ATTEMPTS: 1
          EDITORIAL_MAX_AGE_HOURS: 96
          EDITORIAL_FETCH_TIMEOUT_MS: 6500
          EDITORIAL_IMAGE_FETCH_TIMEOUT_MS: 5000
          EDITORIAL_GEMINI_TIMEOUT_MS: 20000
          EDITORIAL_SOURCE_ITEMS: 24
        run: |
          echo "FOR THE CULTURE editorial generation model: $EDITORIAL_MODEL"
          echo "FOR THE CULTURE editorial generation mode: $EDITORIAL_GENERATION_MODE"
          node scripts/editorial-radar.mjs

      - name: Check editorial run status
        if: always()
        run: |
          if [ -f editorial-run-status.json ]; then
            cat editorial-run-status.json
          else
            echo "editorial-run-status.json was not created."
          fi

      - name: Validate editorial feed before publishing
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs')
          const feed = JSON.parse(fs.readFileSync('public/editorial-feed.json', 'utf8'))
          if (!Array.isArray(feed.stories)) throw new Error('editorial-feed.json has no stories array')
          if (feed.stories.some((story) => !story || !story.headline || !story.body || !story.source_url)) {
            throw new Error('editorial-feed.json contains an incomplete story record')
          }
          const status = fs.existsSync('editorial-run-status.json')
            ? JSON.parse(fs.readFileSync('editorial-run-status.json', 'utf8'))
            : {}
          const published = Number(status.published_this_run || 0)
          if (published > 0 && feed.stories.length === 0) {
            throw new Error('Editorial radar reported published stories, but the public feed is empty.')
          }
          console.log(`Feed validation OK: ${feed.stories.length} stories; ${published} published this run.`)
          NODE

      - name: Commit new editorial feed when stories changed
        id: feed_commit
        run: |
          set -euo pipefail

          git config user.name "FOR THE CULTURE Editorial Radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- public/editorial-feed.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new editorial feed content was generated by this scan."
            exit 0
          fi

          cp public/editorial-feed.json /tmp/for-the-culture-editorial-feed.json

          # A scheduled scan can overlap with another main-branch update.
          # Rebase the generated feed onto the newest main before pushing it.
          for attempt in 1 2 3; do
            echo "Synchronizing editorial feed with origin/main (attempt $attempt/3)..."
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/for-the-culture-editorial-feed.json public/editorial-feed.json

            git add public/editorial-feed.json
            if git diff --cached --quiet; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "The generated editorial feed is already present on main."
              exit 0
            fi

            git commit -m "chore: update FOR THE CULTURE editorial feed"

            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "Editorial feed committed successfully."
              exit 0
            fi

            echo "Push was rejected because main moved. Retrying..."
          done

          echo "Unable to push the editorial feed after 3 synchronization attempts."
          exit 1

      # IMPORTANT:
      # Do not hand deployment off to a separate push-triggered workflow.
      # GitHub Actions commits made with GITHUB_TOKEN do not reliably trigger
      # another workflow. The newsroom therefore builds and deploys the
      # current workspace directly, whether this scan created new stories or
      # simply confirmed/preserved the existing feed.
      - name: Build website with published editorial feed
        run: pnpm run build

      - name: Configure GitHub Pages for editorial deployment
        uses: actions/configure-pages@v5

      - name: Upload editorial Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      # GitHub Pages can occasionally return a transient HTTP 5xx /
      # "other side closed" response after accepting the artifact. The
      # artifact is already valid at this point, so retry the deployment
      # action instead of failing the entire editorial run on a transient
      # Pages API connection.
      - name: Deploy editorial update to GitHub Pages (attempt 1)
        id: deployment_1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before GitHub Pages retry
        if: steps.deployment_1.outcome == 'failure'
        run: sleep 10

      - name: Deploy editorial update to GitHub Pages (attempt 2)
        id: deployment_2
        if: steps.deployment_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before final GitHub Pages retry
        if: steps.deployment_1.outcome == 'failure' && steps.deployment_2.outcome == 'failure'
        run: sleep 15

      - name: Deploy editorial update to GitHub Pages (attempt 3)
        id: deployment_3
        if: steps.deployment_1.outcome == 'failure' && steps.deployment_2.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Fail if GitHub Pages deployment did not succeed
        if: steps.deployment_1.outcome == 'failure' && steps.deployment_2.outcome == 'failure' && steps.deployment_3.outcome == 'failure'
        run: |
          echo "GitHub Pages deployment failed after three attempts."
          exit 1

      - name: Verify editorial deployment handoff
        run: |
          echo "FOR THE CULTURE editorial deployment completed."
          echo "Published feed stories: $(node -e "const fs=require('fs'); const f=JSON.parse(fs.readFileSync('public/editorial-feed.json','utf8')); process.stdout.write(String(f.stories.length))")"
          if [ "${{ steps.deployment_1.outcome }}" = "success" ]; then
            echo "GitHub Pages deployment succeeded on attempt 1."
          elif [ "${{ steps.deployment_2.outcome }}" = "success" ]; then
            echo "GitHub Pages deployment succeeded on attempt 2."
          else
            echo "GitHub Pages deployment succeeded on attempt 3."
          fi
