name: FOR THE CULTURE Editorial Radar

on:
  # The editorial engine is intentionally not triggered on every code push.
  # Gemini's free tier has a daily request quota; one batched request can
  # publish several stories, so scheduled runs are spaced six hours apart.
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: for-the-culture-editorial
  cancel-in-progress: true

jobs:
  scan-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: false
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run FOR THE CULTURE editorial radar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EDITORIAL_MODEL: gemini-3.5-flash-lite
          EDITORIAL_GENERATION_MODE: single-batch
          EDITORIAL_MAX_STORIES_PER_SCAN: 4
          EDITORIAL_GEMINI_ATTEMPTS: 1
          EDITORIAL_MAX_AGE_HOURS: 96
          EDITORIAL_FETCH_TIMEOUT_MS: 6500
          EDITORIAL_IMAGE_FETCH_TIMEOUT_MS: 5000
          EDITORIAL_GEMINI_TIMEOUT_MS: 20000
          EDITORIAL_SOURCE_ITEMS: 24
        run: |
          echo "FOR THE CULTURE editorial generation model: $EDITORIAL_MODEL"
          echo "FOR THE CULTURE editorial generation mode: $EDITORIAL_GENERATION_MODE"
          node scripts/editorial-radar.mjs

      - name: Check editorial run status
        if: always()
        run: |
          if [ -f editorial-run-status.json ]; then cat editorial-run-status.json; fi

      - name: Validate editorial feed before publishing
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs')
          const feed = JSON.parse(fs.readFileSync('public/editorial-feed.json', 'utf8'))
          if (!Array.isArray(feed.stories)) throw new Error('editorial-feed.json has no stories array')
          const status = fs.existsSync('editorial-run-status.json')
            ? JSON.parse(fs.readFileSync('editorial-run-status.json', 'utf8'))
            : {}
          const published = Number(status.published_this_run || 0)
          if (published > 0 && feed.stories.length === 0) {
            throw new Error('Editorial radar reported published stories, but the public feed is empty.')
          }
          console.log(`Feed validation OK: ${feed.stories.length} stories; ${published} published this run.`)
          NODE

      - name: Commit new editorial feed when stories changed
        id: feed_commit
        run: |
          set -euo pipefail

          git config user.name "FOR THE CULTURE Editorial Radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The editorial scan can take long enough for another commit to land
          # on main. Preserve the generated feed, synchronize the checkout with
          # the current remote branch, then apply the feed on top of that branch.
          # This prevents the non-fast-forward push failure that stopped the
          # newsroom after Gemini successfully generated stories.
          # Only publish the feed when this scan actually created stories.
          # This avoids needless commits/deploys when a scheduled scan finds
          # no new candidates or Gemini is temporarily quota-limited.
          if [ -f editorial-run-status.json ]; then
            PUBLISHED="$(node -e "const fs=require('fs'); const s=JSON.parse(fs.readFileSync('editorial-run-status.json','utf8')); process.stdout.write(String(s.published_this_run || 0))")"
          else
            PUBLISHED="0"
          fi

          if [ "$PUBLISHED" = "0" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new published editorial stories in this scan."
            exit 0
          fi

          echo "Editorial radar generated $PUBLISHED new stories."
          node - <<'NODE'
          const fs = require('fs')
          const feed = JSON.parse(fs.readFileSync('public/editorial-feed.json', 'utf8'))
          if (!Array.isArray(feed.stories) || feed.stories.length === 0) {
            throw new Error('The radar reported published stories but public/editorial-feed.json is empty.')
          }
          console.log(`Publishing ${feed.stories.length} stories to the static GitHub Pages feed.`)
          NODE

          if git diff --quiet -- public/editorial-feed.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new published editorial feed content."
            exit 0
          fi

          cp public/editorial-feed.json /tmp/for-the-culture-editorial-feed.json

          for attempt in 1 2 3; do
            echo "Synchronizing editorial feed with origin/main (attempt $attempt/3)..."
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/for-the-culture-editorial-feed.json public/editorial-feed.json

            git add public/editorial-feed.json
            if git diff --cached --quiet; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Editorial feed matches the latest main branch."
              exit 0
            fi

            git commit -m "chore: update FOR THE CULTURE editorial feed"

            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "Editorial feed committed and pushed successfully."
              exit 0
            fi

            echo "Push was rejected because main moved. Refreshing and retrying..."
          done

          echo "Unable to push the editorial feed after 3 synchronization attempts."
          exit 1

      - name: Report deployment handoff
        run: |
          if [ "${{ steps.feed_commit.outputs.changed }}" = "true" ]; then
            echo "Editorial feed committed to main. The Deploy Galaxy Fire Studios Website workflow will build and deploy the updated feed from the remote main branch."
          else
            echo "No editorial feed commit was required. Existing deployed content is left untouched."
          fi
